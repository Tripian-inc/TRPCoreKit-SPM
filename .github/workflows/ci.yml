name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build the package rather than the legacy project
        run: rm -rf TRPCoreKit.xcodeproj

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme TRPCoreKit \
            -destination "id=$SIMULATOR_UDID" \
            -testLanguage en \
            -testRegion US \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults.xcresult \
            | tee xcodebuild.log | grep -E "error:|failed|Executed|\*\* TEST"

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
